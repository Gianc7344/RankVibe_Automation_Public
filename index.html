<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankVibe Automation</title>
    <meta name="description" content="RankVibe YouTube Shorts ranking video automation tool">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════
           DESIGN SYSTEM
           ═══════════════════════════════════════════ */
        :root {
            --bg-deep:    #050a1a;
            --bg-base:    #0a1128;
            --bg-card:    #0f1a3a;
            --bg-card-hover: #142042;
            --bg-glass:   rgba(15, 26, 58, 0.65);
            --border:     rgba(59, 130, 246, 0.15);
            --border-glow:rgba(59, 130, 246, 0.4);
            --accent:     #2563eb;
            --accent-light:#60a5fa;
            --accent-soft: #3b82f6;
            --green:      #22c55e;
            --red:        #ef4444;
            --orange:     #f59e0b;
            --text:       #f1f5f9;
            --text-dim:   #94a3b8;
            --text-muted: #64748b;
            --radius:     16px;
            --radius-sm:  10px;
            --radius-xs:  6px;
            --shadow:     0 8px 32px rgba(0,0,0,0.4);
            --shadow-glow:0 0 30px rgba(37,99,235,0.15);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(37,99,235,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(96,165,250,0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ─────────────────────────────── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            background: rgba(10, 17, 40, 0.8);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(37,99,235,0.3);
        }
        .logo span { color: var(--accent-light); }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .status-idle {
            background: rgba(34,197,94,0.1);
            color: var(--green);
            border: 1px solid rgba(34,197,94,0.2);
        }
        .status-busy {
            background: rgba(245,158,11,0.1);
            color: var(--orange);
            border: 1px solid rgba(245,158,11,0.2);
            animation: pulse-badge 2s ease-in-out infinite;
        }
        @keyframes pulse-badge {
            0%,100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ── LAYOUT ─────────────────────────────── */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .full-width { grid-column: 1 / -1; }

        /* ── CARD ────────────────────────────────── */
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            border-color: var(--border-glow);
            box-shadow: var(--shadow), var(--shadow-glow);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .icon {
            font-size: 1.3rem;
        }
        .card-subtitle {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* ── INPUTS ──────────────────────────────── */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: rgba(5, 10, 26, 0.6);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        /* ── BUTTONS ─────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #4f8afa);
            color: white;
            box-shadow: 0 4px 15px rgba(37,99,235,0.3);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(37,99,235,0.45);
        }
        .btn-green {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: white;
            box-shadow: 0 4px 15px rgba(34,197,94,0.3);
        }
        .btn-green:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(34,197,94,0.45);
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .btn.loading .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── LOG TERMINAL ────────────────────────── */
        .log-box {
            background: rgba(2, 6, 18, 0.7);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.78rem;
            line-height: 1.7;
            color: var(--text-dim);
            max-height: 280px;
            overflow-y: auto;
            scroll-behavior: smooth;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-box:empty::before {
            content: 'Terminal çıktısı burada görünecek...';
            color: var(--text-muted);
            font-style: italic;
        }
        .log-box .log-success { color: var(--green); }
        .log-box .log-error   { color: var(--red); }
        .log-box .log-warn    { color: var(--orange); }

        /* ── CLIP GALLERY ────────────────────────── */
        .gallery-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .selection-count {
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .selection-count strong {
            color: var(--accent-light);
            font-weight: 700;
        }
        .clip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            max-height: 620px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .clip-grid::-webkit-scrollbar { width: 6px; }
        .clip-grid::-webkit-scrollbar-track { background: transparent; }
        .clip-grid::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 3px; }

        .clip-card {
            position: relative;
            border-radius: var(--radius-sm);
            border: 2px solid transparent;
            background: var(--bg-card);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .clip-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .clip-card.selected {
            border-color: var(--accent-light);
            box-shadow: 0 0 20px rgba(37,99,235,0.25);
        }
        .clip-card.selected::after {
            content: attr(data-order);
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            z-index: 5;
        }
        .clip-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: var(--bg-deep);
        }
        .clip-thumb-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, var(--bg-deep), var(--bg-card));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--text-muted);
        }
        .clip-info {
            padding: 10px 12px;
        }
        .clip-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .clip-size {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* ── OUTPUT SECTION ──────────────────────── */
        .output-section {
            margin-top: 20px;
        }
        .download-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            background: rgba(34,197,94,0.08);
            border: 1px solid rgba(34,197,94,0.2);
            margin-top: 12px;
        }
        .download-card a {
            color: var(--green);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .download-card a:hover { color: #4ade80; }

        /* ── STEP INDICATOR ──────────────────────── */
        .steps {
            display: flex;
            gap: 0;
            margin-bottom: 32px;
        }
        .step {
            flex: 1;
            padding: 18px 20px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border);
            position: relative;
            transition: all 0.3s;
        }
        .step:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
        .step:last-child  { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
        .step.active {
            color: var(--text);
            background: rgba(37,99,235,0.1);
            border-color: var(--accent);
        }
        .step.completed {
            color: var(--green);
            background: rgba(34,197,94,0.05);
            border-color: rgba(34,197,94,0.3);
        }
        .step-num {
            display: inline-flex;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            margin-right: 8px;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            vertical-align: middle;
        }
        .step.active .step-num {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .step.completed .step-num {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }

        /* ── SECTION PANELS ──────────────────────── */
        .panel { display: none; }
        .panel.visible { display: block; }

        /* ── EMPTY STATE ─────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { font-size: 0.9rem; line-height: 1.6; }

        /* ── RESPONSIVE ──────────────────────────── */
        @media (max-width: 900px) {
            .grid-2 { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            .steps { flex-direction: column; }
            .step:first-child { border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
            .step:last-child  { border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
        }
    </style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="header">
    <div class="header-inner">
        <div class="logo">
            <div class="logo-icon">🎬</div>
            Rank<span>Vibe</span>
        </div>
        <div id="globalStatus" class="status-badge status-idle">● Hazır</div>
    </div>
</header>

<!-- ═══ MAIN CONTENT ═══ -->
<main class="container">

    <!-- STEP INDICATOR -->
    <div class="steps">
        <div class="step active" id="step1" onclick="goToStep(1)" style="cursor:pointer">
            <span class="step-num">1</span>
            Sahne Kesim
        </div>
        <div class="step" id="step2" onclick="goToStep(2)" style="cursor:pointer">
            <span class="step-num">2</span>
            Klip Seçimi
        </div>
        <div class="step" id="step3" onclick="goToStep(3)" style="cursor:pointer">
            <span class="step-num">3</span>
            Video Oluştur
        </div>
    </div>

    <!-- ═══ PANEL 1: SAHNE KESİM ═══ -->
    <section class="panel visible" id="panel1">
        <div class="card">
            <div class="card-title">
                <span class="icon">✂️</span>
                Sahne Kesim
                <div class="card-subtitle" style="margin-left:auto; margin-bottom:0; margin-top:0">
                    YouTube linkini yapıştır, sahneleri otomatik kes
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
                <button class="btn btn-primary" id="btnCut" onclick="startCutting()">
                    <span class="spinner"></span>
                    ✂️ Sahneleri Kes
                </button>
            </div>
            <div class="log-box" id="cutLog"></div>
        </div>
    </section>

    <!-- ═══ PANEL 2: KLİP SEÇİMİ ═══ -->
    <section class="panel" id="panel2">
        <div class="card">
            <div class="card-title">
                <span class="icon">🎞️</span>
                Klip Seçimi
            </div>
            <div class="gallery-controls">
                <div class="selection-count">
                    Seçilen: <strong id="selCount">0</strong> / 5
                    <span style="margin-left:8px; font-size:0.75rem; color:var(--text-muted)">
                        (İlk seçilen = 5. sıra, son seçilen = 1. sıra)
                    </span>
                </div>
                <div style="display:flex; gap:8px">
                    <button class="btn btn-primary" id="btnRefresh" onclick="loadClips()" style="padding:10px 16px; font-size:0.8rem">
                        🔄 Yenile
                    </button>
                    <button class="btn btn-primary" id="btnClearSel" onclick="clearSelection()" style="padding:10px 16px; font-size:0.8rem">
                        ✖ Temizle
                    </button>
                </div>
            </div>
            <div id="clipGallery" class="clip-grid">
                <div class="empty-state">
                    <div class="icon">📂</div>
                    <p>Henüz klip yok. Önce sahne kesim işlemi yapın.</p>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; margin-top:20px; gap:12px">
                <button class="btn btn-primary" onclick="goToStep(1)" style="opacity:0.7">← Geri</button>
                <button class="btn btn-green" id="btnNext2" onclick="goToStep(3)" disabled>
                    Video Oluştur →
                </button>
            </div>
        </div>
    </section>

    <!-- ═══ PANEL 3: VIDEO OLUŞTUR ═══ -->
    <section class="panel" id="panel3">
        <div class="card">
            <div class="card-title">
                <span class="icon">🎥</span>
                Ranking Video Oluştur
            </div>

            <!-- Seçim Özeti -->
            <div id="selSummary" style="margin-bottom:16px"></div>

            <button class="btn btn-green" id="btnCreate" onclick="startCreating()">
                <span class="spinner"></span>
                🚀 Video Oluştur
            </button>

            <div class="log-box" id="createLog" style="margin-top:16px"></div>

            <div class="output-section" id="outputSection" style="display:none">
                <h3 style="font-size:0.95rem; font-weight:600; color:var(--green)">✅ Video Hazır!</h3>
                <div id="outputList"></div>
            </div>

            <div style="margin-top:20px">
                <button class="btn btn-primary" onclick="goToStep(2)" style="opacity:0.7">← Kliplere Dön</button>
            </div>
        </div>
    </section>

</main>

<script>
/* ══════════════════════════════════════════
   STATE
   ══════════════════════════════════════════ */
let selectedClips = [];   // seçim sırasına göre clip filename listesi
let isBusy = false;

/* ══════════════════════════════════════════
   STEP NAVIGATION
   ══════════════════════════════════════════ */
function goToStep(n) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
    document.getElementById(`panel${n}`).classList.add('visible');

    document.querySelectorAll('.step').forEach((s, i) => {
        s.classList.remove('active', 'completed');
        if (i + 1 < n)  s.classList.add('completed');
        if (i + 1 === n) s.classList.add('active');
    });

    if (n === 2) loadClips();
    if (n === 3) renderSummary();
}

/* ══════════════════════════════════════════
   STATUS
   ══════════════════════════════════════════ */
function setGlobalStatus(busy) {
    isBusy = busy;
    const el = document.getElementById('globalStatus');
    if (busy) {
        el.className = 'status-badge status-busy';
        el.textContent = '⚡ İşlem Devam Ediyor';
    } else {
        el.className = 'status-badge status-idle';
        el.textContent = '● Hazır';
    }
}

/* ══════════════════════════════════════════
   SAHNE KESİM (SSE)
   ══════════════════════════════════════════ */
function startCutting() {
    const url = document.getElementById('ytUrl').value.trim();
    if (!url) { alert('Lütfen YouTube linki gir!'); return; }
    if (isBusy) return;

    const btn = document.getElementById('btnCut');
    const log = document.getElementById('cutLog');
    btn.disabled = true;
    btn.classList.add('loading');
    log.innerHTML = '';
    setGlobalStatus(true);

    fetch('/api/cut-scenes', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url})
    }).then(resp => {
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        function pump() {
            reader.read().then(({done, value}) => {
                if (done) { finish(); return; }
                buffer += decoder.decode(value, {stream: true});
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const msg = JSON.parse(line.slice(6));
                            if (msg.type === 'log') appendLog(log, msg.text);
                            if (msg.type === 'done') { finish(); return; }
                        } catch(e) {}
                    }
                }
                pump();
            });
        }

        function finish() {
            btn.disabled = false;
            btn.classList.remove('loading');
            setGlobalStatus(false);
            appendLog(log, '\n─── İşlem tamamlandı ───', 'log-success');
            // otomatik olarak klip seçim ekranına geç
            setTimeout(() => goToStep(2), 1500);
        }

        pump();
    }).catch(err => {
        appendLog(log, `Bağlantı hatası: ${err}`, 'log-error');
        btn.disabled = false;
        btn.classList.remove('loading');
        setGlobalStatus(false);
    });
}

/* ══════════════════════════════════════════
   KLİP GALERİSİ
   ══════════════════════════════════════════ */
function loadClips() {
    fetch('/api/clips').then(r => r.json()).then(clips => {
        const g = document.getElementById('clipGallery');
        if (!clips.length) {
            g.innerHTML = `<div class="empty-state"><div class="icon">📂</div><p>Henüz klip yok.</p></div>`;
            return;
        }
        g.innerHTML = clips.map(c => {
            const isSelected = selectedClips.includes(c.filename);
            const order = isSelected ? selectedClips.indexOf(c.filename) + 1 : '';
            const rankLabel = order ? (5 - order + 1) : '';
            return `
                <div class="clip-card ${isSelected ? 'selected' : ''}"
                     data-file="${c.filename}"
                     data-order="${order ? '#' + rankLabel : ''}"
                     onclick="toggleClip('${c.filename}')">
                    ${c.thumbnail
                        ? `<img class="clip-thumb" src="/thumbnails/${c.thumbnail}" alt="${c.filename}" loading="lazy">`
                        : `<div class="clip-thumb-placeholder">🎬</div>`}
                    <div class="clip-info">
                        <div class="clip-name">${c.filename}</div>
                        <div class="clip-size">${c.size_mb} MB</div>
                    </div>
                </div>`;
        }).join('');
        updateSelCount();
    });
}

function toggleClip(filename) {
    const idx = selectedClips.indexOf(filename);
    if (idx >= 0) {
        selectedClips.splice(idx, 1);
    } else {
        if (selectedClips.length >= 5) {
            alert('En fazla 5 klip seçebilirsin! Birini kaldır önce.');
            return;
        }
        selectedClips.push(filename);
    }
    // Re-render cards
    document.querySelectorAll('.clip-card').forEach(card => {
        const f = card.dataset.file;
        const i = selectedClips.indexOf(f);
        if (i >= 0) {
            card.classList.add('selected');
            card.dataset.order = '#' + (5 - i);
        } else {
            card.classList.remove('selected');
            card.dataset.order = '';
        }
    });
    updateSelCount();
}

function clearSelection() {
    selectedClips = [];
    document.querySelectorAll('.clip-card').forEach(c => {
        c.classList.remove('selected');
        c.dataset.order = '';
    });
    updateSelCount();
}

function updateSelCount() {
    document.getElementById('selCount').textContent = selectedClips.length;
    document.getElementById('btnNext2').disabled = selectedClips.length !== 5;
}

/* ══════════════════════════════════════════
   VIDEO OLUŞTUR (SSE)
   ══════════════════════════════════════════ */
function renderSummary() {
    const el = document.getElementById('selSummary');
    if (!selectedClips.length) {
        el.innerHTML = '<p style="color:var(--text-muted)">Klip seçilmedi.</p>';
        return;
    }
    el.innerHTML = `
        <table style="width:100%; border-collapse:collapse; font-size:0.82rem">
            <thead>
                <tr style="text-align:left; color:var(--text-dim); border-bottom:1px solid var(--border)">
                    <th style="padding:8px 4px">Sıra</th>
                    <th style="padding:8px 4px">Klip</th>
                </tr>
            </thead>
            <tbody>
                ${selectedClips.map((f, i) => {
                    const rank = 5 - i;
                    const colors = {5:'var(--text-muted)',4:'var(--text-muted)',3:'var(--accent-light)',2:'var(--orange)',1:'var(--green)'};
                    return `<tr style="border-bottom:1px solid var(--border)">
                        <td style="padding:8px 4px; font-weight:700; color:${colors[rank]}">${rank}. sıra</td>
                        <td style="padding:8px 4px; color:var(--text)">${f}</td>
                    </tr>`;
                }).join('')}
            </tbody>
        </table>
    `;
}

function startCreating() {
    if (selectedClips.length !== 5) { alert('5 klip seçmelisin!'); return; }
    if (isBusy) return;

    const btn = document.getElementById('btnCreate');
    const log = document.getElementById('createLog');
    btn.disabled = true;
    btn.classList.add('loading');
    log.innerHTML = '';
    document.getElementById('outputSection').style.display = 'none';
    setGlobalStatus(true);

    fetch('/api/create-video', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({clips: selectedClips})
    }).then(resp => {
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        function pump() {
            reader.read().then(({done, value}) => {
                if (done) { finish(); return; }
                buffer += decoder.decode(value, {stream: true});
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const msg = JSON.parse(line.slice(6));
                            if (msg.type === 'log') appendLog(log, msg.text);
                            if (msg.type === 'done') { finish(); return; }
                        } catch(e) {}
                    }
                }
                pump();
            });
        }

        function finish() {
            btn.disabled = false;
            btn.classList.remove('loading');
            setGlobalStatus(false);
            appendLog(log, '\n─── Video oluşturma tamamlandı ───', 'log-success');
            loadOutputVideos();
        }

        pump();
    }).catch(err => {
        appendLog(log, `Hata: ${err}`, 'log-error');
        btn.disabled = false;
        btn.classList.remove('loading');
        setGlobalStatus(false);
    });
}

function loadOutputVideos() {
    fetch('/api/output-videos').then(r => r.json()).then(videos => {
        if (!videos.length) return;
        const section = document.getElementById('outputSection');
        const list = document.getElementById('outputList');
        section.style.display = 'block';
        list.innerHTML = videos.map(v => `
            <div class="download-card">
                <span>🎬 ${v.filename} <span style="color:var(--text-muted); font-size:0.8rem">(${v.size_mb} MB)</span></span>
                <a href="/output/${v.filename}" download>⬇ İndir</a>
            </div>
        `).join('');
    });
}

/* ══════════════════════════════════════════
   LOG HELPER
   ══════════════════════════════════════════ */
function appendLog(el, text, cls) {
    const line = document.createElement('div');
    // color-code based on content
    if (cls) {
        line.className = cls;
    } else if (text.includes('✅') || text.includes('✓') || text.includes('BİTTİ')) {
        line.className = 'log-success';
    } else if (text.includes('❌') || text.includes('HATA') || text.includes('error')) {
        line.className = 'log-error';
    } else if (text.includes('⚠️') || text.includes('UYARI') || text.includes('Rate limit')) {
        line.className = 'log-warn';
    }
    line.textContent = text;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
}
</script>
